server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:  
          routes:
            - id: auth_service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: volunteer_module
              uri: http://localhost:8082
              predicates:
                - Path=/api/volunteers/**
              
            - id: disaster_module
              uri: http://localhost:8083
              predicates:
                - Path=/api/disasters/**

            - id: task-assign-module
              uri: http://localhost:8084
              predicates:
                - Path=/api/tasks/**