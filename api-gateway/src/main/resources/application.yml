server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]': 
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
      mvc:
        routes:


          - id: auth_route
            uri: http://localhost:8081
            predicates:
              - Path=/api/auth/**


          - id: volunteer_route
            uri: http://localhost:8082
            predicates:
              - Path=/api/volunteers/**


          - id: task_route
            uri: http://localhost:8083
            predicates:
              - Path=/api/tasks/**
